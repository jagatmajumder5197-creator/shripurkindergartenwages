<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shripur Kindergarten School - Wages Slip Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #cbd5e1;
            color: #0f172a;
            padding: 10px;
        }

        .no-print {
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .no-print h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group select {
            padding: 8px 12px;
            font-size: 13px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .filter-group button {
            padding: 8px 16px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-load {
            background-color: #3b82f6;
            color: white;
        }

        .btn-load:hover {
            background-color: #2563eb;
        }

        .btn-print {
            background-color: #10b981;
            color: white;
        }

        .btn-print:hover {
            background-color: #059669;
        }

        .container {
            max-width: 210mm;
            margin: 0 auto;
        }

        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            margin: 0 auto 15mm auto;
            padding: 8mm;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 5mm;
            page-break-after: always;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .salary-slip {
            border: 1.5px solid #1f2937;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 8.5px;
            line-height: 1.3;
        }

   
      
        
  .school-header {
    display: flex;
    align-items: center;
    border-bottom: 2px solid #1f2937;
    padding-bottom: 6px;
    margin-bottom: 6px;
    gap: 8px;
}

.school-header img {
    height: 24px;
    width: auto;
    flex-shrink: 0;      
    margin-bottom: 0;
}

.school-header > div {
    text-align: left;    
    flex-grow: 1;  
    min-width: 0;
}
        
        
        .month-title {
            font-size: 8px;
            font-weight: 600;
            color: #334155;
        }

        .staff-box {
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 5px;
            margin-bottom: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 7.5px;
        }

        .staff-col {
            line-height: 1.3;
        }

        .staff-label {
            font-weight: 700;
            color: #1f2937;
        }

        .section-title {
            font-size: 8px;
            font-weight: 700;
            color: #0f172a;
            margin: 4px 0 3px 0;
            border-bottom: 1px solid #3b82f6;
            padding-bottom: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 7.5px;
            margin-bottom: 4px;
        }

        th, td {
            border: 1px solid #64748b;
            padding: 2px 3px;
            text-align: center;
        }

        th {
            background-color: #e5e7eb;
            font-weight: 700;
            color: #1f2937;
        }

        .perf-label {
            text-align: left;
            background-color: #f9fafb;
            font-weight: 600;
            width: 40%;
        }

        .perf-value {
            width: 20%;
        }

        .spacer {
            border: none;
            background: transparent;
        }

        .net-cell {
            background-color: #dbeafe;
            font-weight: 700;
            color: #1e40af;
        }

        .conditions {
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 3px;
            padding: 4px;
            margin-bottom: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            font-size: 6.5px;
            line-height: 1.2;
        }

        .condition-item span {
            display: block;
            font-weight: 700;
            color: #1f2937;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 2px;
            margin-bottom: 2px;
            font-size: 7px;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid #d1d5db;
        }

        .sig {
            width: 45%;
            text-align: center;
            font-size: 7px;
        }

        .sig-line {
            border-top: 1px solid #1f2937;
            padding-top: 2px;
            margin-top: 8px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #6b7280;
            padding: 40px;
            font-size: 14px;
        }

        .error {
            text-align: center;
            color: #dc2626;
            padding: 40px;
            font-size: 14px;
            background: #fee2e2;
            border-radius: 8px;
            margin: 20px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .a4-page {
                margin: 0;
                padding: 8mm;
                box-shadow: none;
                page-break-after: always;
                height: 297mm;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Shripur Kindergarten School</h1>
        <p style="color: #6b7280; font-size: 16px; margin-bottom: 20px;">Wages Slip Portal</p>
        
        <div class="filter-group">
            <select id="monthYearSelect">
                <option value="ALL">All Months & Years</option>
            </select>

            <select id="staffSelect">
                <option value="ALL">All Staff</option>
            </select>

            <button class="btn-load" onclick="applyFilters()">Load Slips</button>
            <button class="btn-print" onclick="window.print()">Print All</button>
        </div>
    </div>

    <div class="container" id="slipContainer">
        <div class="loading">Loading wages data...</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby9ztHIsUquB8bcsBEtajptsjOg85Eaxqoi1p9RzxLe8bJhKG-WjDwQlG503jxcEgkI/exec";
        let allData = [];
        let allDataFiltered = [];

        async function fetchData() {
            try {
                console.log('Fetching from:', GAS_URL);
                const response = await fetch(GAS_URL, { redirect: 'follow' });
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const rawData = await response.json();
                console.log('Raw data from GAS:', rawData);
                
                parseAndProcessData(rawData);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('slipContainer').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function parseAndProcessData(rawData) {
            console.log('=== PARSING DATA ===');
            
            if (!rawData) {
                showError('No data received from server');
                return;
            }

            let processedData = [];

            // Handle different data formats
            if (Array.isArray(rawData)) {
                console.log('Data is an array, length:', rawData.length);
                
                if (rawData.length === 0) {
                    showError('Empty data array');
                    return;
                }

                // Check if first element is array (2D array) or object
                if (Array.isArray(rawData[0])) {
                    console.log('Format: 2D Array - Headers in first row');
                    const headers = rawData[0].map((h, idx) => {
                        const headerStr = String(h || '').trim();
                        console.log(`Header ${idx}: '${headerStr}'`);
                        return headerStr;
                    });

                    // Process data rows starting from index 1
                    for (let i = 1; i < rawData.length; i++) {
                        const row = rawData[i];
                        if (!row) continue;

                        const rowObj = {};
                        headers.forEach((header, idx) => {
                            const value = String(row[idx] || '').trim();
                            rowObj[header] = value;
                        });

                        processedData.push(rowObj);
                        console.log(`Row ${i}:`, rowObj);
                    }
                } else if (typeof rawData[0] === 'object') {
                    console.log('Format: Array of Objects');
                    processedData = rawData.map((item, idx) => {
                        const obj = {};
                        Object.keys(item).forEach(key => {
                            obj[key.trim()] = String(item[key] || '').trim();
                        });
                        console.log(`Item ${idx}:`, obj);
                        return obj;
                    });
                }
            } else if (typeof rawData === 'object') {
                console.log('Data is a single object - wrapping in array');
                processedData = [rawData];
            }

            console.log(`Total rows processed: ${processedData.length}`);

            // Filter for ACT records
            console.log('=== FILTERING FOR ACT ===');
            allDataFiltered = processedData.filter((row, idx) => {
                const stat = String(row.STAT || '').trim().toUpperCase();
                const match = stat === 'ACT';
                console.log(`Row ${idx}: STAT='${String(row.STAT || '')}' | Trimmed & Upper='${stat}' | Match=${match} | Name=${row.NAME_OF_STAFF || 'N/A'}`);
                return match;
            });

            console.log(`ACT records found: ${allDataFiltered.length}`);

            if (allDataFiltered.length === 0) {
                console.warn('No ACT records found!');
                console.warn('All STAT values:', processedData.map(r => `'${r.STAT}'`));
                showError('No active records found in the data');
                return;
            }

            allData = allDataFiltered;
            console.log('ACT data:', allData);

            // Populate filters and render
            populateFilters();
            renderSlips(allData);
        }

        function populateFilters() {
            console.log('=== POPULATING FILTERS ===');
            
            const monthYearSet = new Set();
            const staffSet = new Set();

            allData.forEach((row, idx) => {
                const month = String(row.MONTH || '').trim();
                const year = String(row.YEAR || '').trim();
                const name = String(row.NAME_OF_STAFF || '').trim();

                if (month && year) {
                    const monthYear = `${month} ${year}`;
                    monthYearSet.add(monthYear);
                    console.log(`Row ${idx}: Added month-year: '${monthYear}'`);
                }

                if (name) {
                    staffSet.add(name);
                    console.log(`Row ${idx}: Added staff: '${name}'`);
                }
            });

            // Update Month/Year dropdown
            const monthYearSelect = document.getElementById('monthYearSelect');
            const monthYearArray = Array.from(monthYearSet).sort();
            monthYearArray.forEach(my => {
                const option = document.createElement('option');
                option.value = my;
                option.textContent = my;
                monthYearSelect.appendChild(option);
            });
            console.log(`Month/Year options added: ${monthYearArray.length}`);

            // Update Staff dropdown
            const staffSelect = document.getElementById('staffSelect');
            const staffArray = Array.from(staffSet).sort();
            staffArray.forEach(staff => {
                const option = document.createElement('option');
                option.value = staff;
                option.textContent = staff;
                staffSelect.appendChild(option);
            });
            console.log(`Staff options added: ${staffArray.length}`);
        }

        function applyFilters() {
            console.log('=== APPLYING FILTERS ===');
            
            const selectedMonthYear = document.getElementById('monthYearSelect').value;
            const selectedStaff = document.getElementById('staffSelect').value;

            console.log(`Selected Month/Year: '${selectedMonthYear}'`);
            console.log(`Selected Staff: '${selectedStaff}'`);

            let filtered = allData;

            if (selectedMonthYear !== 'ALL') {
                const [month, year] = selectedMonthYear.split(' ');
                console.log(`Filtering by month='${month}' year='${year}'`);
                
                filtered = filtered.filter(row => {
                    const rowMonth = String(row.MONTH || '').trim();
                    const rowYear = String(row.YEAR || '').trim();
                    const match = rowMonth === month && rowYear === year;
                    return match;
                });
            }

            if (selectedStaff !== 'ALL') {
                console.log(`Filtering by staff='${selectedStaff}'`);
                
                filtered = filtered.filter(row => {
                    const rowStaff = String(row.NAME_OF_STAFF || '').trim();
                    const match = rowStaff === selectedStaff;
                    return match;
                });
            }

            console.log(`Filtered records: ${filtered.length}`);
            renderSlips(filtered);
        }

        function renderSlips(data) {
            console.log('=== RENDERING SLIPS ===');
            console.log(`Rendering ${data.length} slips`);

            const container = document.getElementById('slipContainer');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="error" style="margin-top: 40px;">No records to display</div>';
                return;
            }

            let html = '';
            
            // Create A4 pages (6 slips per page)
            for (let pageIdx = 0; pageIdx < data.length; pageIdx += 6) {
                const pageSlips = data.slice(pageIdx, pageIdx + 6);
                html += '<div class="a4-page">';

                pageSlips.forEach(row => {
                    html += generateSlip(row);
                });

                html += '</div>';
            }

            container.innerHTML = html;
            console.log('Slips rendered successfully');
        }

        function generateSlip(row) {
            // Parse numeric values
            const basic = parseFloat(row.BASIC) || 0;
            const redFd = parseFloat(row.RED_FD) || 0;
            const greenFd = parseFloat(row.GREEN_FD) || 0;
            const workingDay = parseFloat(row.WORKING_DAY) || 26;
            const advanced = parseFloat(row.ADVANCED) || 0;
            const fees = parseFloat(row.FEES) || 0;

            // Calculate Red Deduction
            let redDtn = 0;
            if (redFd === 1) {
                redDtn = (basic * 1) / 30;
            } else if (redFd > 1) {
                redDtn = (basic * redFd) / workingDay;
            }

            // Calculate Green Deduction
            let greenDtn = 0;
            if (greenFd > 0 && greenFd <= 2) {
                greenDtn = (basic * greenFd) / 30;
            } else if (greenFd > 2) {
                greenDtn = (basic * greenFd) / workingDay;
            }

            // Calculate Final Net Wages
            const netWages = (basic - redDtn - greenDtn - advanced - fees).toFixed(2);

            // Get string values
            const month = String(row.MONTH || '').trim();
            const year = String(row.YEAR || '').trim();
            const name = String(row.NAME_OF_STAFF || '').trim();
            const phone = String(row.PHONE_NO || '').trim();
            const address = String(row.ADDRESS || '').trim();
            const totalDay = String(row.TOTAL_DAY || '').trim();
            const sunDay = String(row.SUN_DAY || '').trim();
            const holiDay = String(row.HOLI_DAY || '').trim();

            return `
                <div class="salary-slip">
                    <div>
                             
                        
                    
   <div class="school-header">
    <img src="Images/logo.png" alt="Logo" onerror="this.style.display='none'">
    <div>
        <h3>SHRIPUR KINDERGARTEN SCHOOL</h3>
        <div class="school-address">At: Shripur, PO: Jharbari, PS: Goalpokher, Distt: Uttardinajpur, WB, Pin: 733210</div>
        <div class="month-title">Wages Slip # ${month} # ${year}</div>
    </div>
</div>
                        
                        
                        
                        <div class="staff-box">
                            <div class="staff-col">
                                <div><span class="staff-label">Name:</span> ${name}</div>
                                <div><span class="staff-label">Advanced:</span> ${advanced.toFixed(2)}</div>
                                <div><span class="staff-label">Fees:</span> ${fees.toFixed(2)}</div>
                            </div>
                            <div class="staff-col">
                                <div><span class="staff-label">Address:</span> ${address}</div>
                                <div><span class="staff-label">Phone:</span> ${phone}</div>
                            </div>
                        </div>

                        <div class="section-title">Performance Details</div>
                        <table>
                            <tr>
                                <td class="perf-label">Total Days</td>
                                <td class="perf-value">${totalDay}</td>
                                <td class="spacer"></td>
                                <td class="perf-label">Working Days</td>
                                <td class="perf-value">${workingDay.toFixed(0)}</td>
                            </tr>
                            <tr>
                                <td class="perf-label">Sundays</td>
                                <td class="perf-value">${sunDay}</td>
                                <td class="spacer"></td>
                                <td class="perf-label">Red F.D.</td>
                                <td class="perf-value">${redFd.toFixed(0)}</td>
                            </tr>
                            <tr>
                                <td class="perf-label">Holidays</td>
                                <td class="perf-value">${holiDay}</td>
                                <td class="spacer"></td>
                                <td class="perf-label">Green F.D.</td>
                                <td class="perf-value">${greenFd.toFixed(0)}</td>
                            </tr>
                        </table>

                        <div class="section-title">Wages Details</div>
                        <table>
                            <tr>
                                <th>Basic</th>
                                <th>Red Dtn</th>
                                <th>Green Dtn</th>
                                <th>Net</th>
                            </tr>
                            <tr>
                                <td>${basic.toFixed(2)}</td>
                                <td>${redDtn.toFixed(2)}</td>
                                <td>${greenDtn.toFixed(2)}</td>
                                <td class="net-cell">${netWages}</td>
                            </tr>
                        </table>

                        <div class="conditions">
                            <div class="condition-item">
                                <span>Red Deduction</span>
                                If FD=1: Basic÷30<br>If FD>1: Basic×FD÷WorkDays
                            </div>
                            <div class="condition-item">
                                <span>Green Deduction</span>
                                If FD≤2: Basic×FD÷30<br>If FD>2: Basic×FD÷WorkDays
                            </div>
                        </div>
                    </div>

                    <div class="signatures">
                        <div class="sig">
                            <div class="sig-line">Staff</div>
                        </div>
                        <div class="sig">
                            <div class="sig-line">Principal</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('slipContainer').innerHTML = `<div class="error">${message}</div>`;
        }

        // Start fetching data when page loads
        window.addEventListener('load', fetchData);
    </script>

</body>
</html>
