<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shripur Kindergarten School - Wages Slip System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: normal;
            font-size: 9px;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #0f172a;
            padding: 20px;
            min-height: 100vh;
        }

        .header-banner {
            max-width: 1000px;
            margin: 0 auto 20px;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            text-align: center;
        }

        .header-banner h1 {
            color: #1e293b;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .header-banner p {
            color: #64748b;
            font-size: 13px;
        }

        .control-panel {
            max-width: 1000px;
            margin: 0 auto 20px;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .control-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .control-group label {
            font-weight: 600;
            color: #1e293b;
            font-size: 12px;
        }

        .control-group select {
            padding: 10px 15px;
            font-size: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            min-width: 250px;
            background: #f8fafc;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-group select:hover,
        .control-group select:focus {
            border-color: #667eea;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-load {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 120px;
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-print {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white;
            min-width: 120px;
        }

        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
        }

        .btn-download {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            min-width: 120px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
        }

        .status-message {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }

        .status-message.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .status-message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .status-message.info {
            background: #e0f2fe;
            color: #0c4a6e;
            display: block;
        }

        .container {
            max-width: 210mm;
            margin: 0 auto;
        }

        .a4-page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            border: 1px solid #ccc;
            margin: 20px auto;
            padding: 6mm 8mm;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 4mm 6mm;
            box-sizing: border-box;
            page-break-after: always;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .salary-slip {
            width: 100%;
            height: 89mm;
            background: #ffffff;
            border: 2px solid #0f172a;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .school-header {
            text-align: center;
            border-bottom: 2px double #0f172a;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .school-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-bottom: 2px;
        }

        .school-top img {
            height: 22px;
            width: auto;
        }

        .school-header h3 {
            font-size: 13px;
            color: #0f172a;
            letter-spacing: 0.3px;
            font-weight: 700;
        }

        .school-address {
            font-size: 7.5px;
            color: #334155;
            margin-bottom: 2px;
        }

        .month-title {
            font-size: 9px;
            color: #334155;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .staff-info-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            padding: 4px 6px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .staff-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 8.5px;
            width: 50%;
        }

        .staff-left div {
            font-weight: 500;
        }

        .staff-right {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 8.5px;
            text-align: left;
            width: 50%;
            line-height: 1.2;
            color: #334155;
        }

        .section-title {
            font-size: 9px;
            color: #1e293b;
            margin-bottom: 2px;
            border-left: 2px solid #2563eb;
            padding-left: 3px;
            font-weight: 600;
        }

        .performance-table, .wages-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 8.5px;
            margin-bottom: 3px;
        }

        .performance-table th, .performance-table td,
        .wages-table th, .wages-table td {
            border: 1px solid #64748b;
            padding: 2px 3px;
            text-align: center;
        }

        .performance-table td:nth-child(odd) {
            text-align: left;
            background-color: #f8fafc;
            width: 28%;
            font-weight: 500;
        }

        .performance-table td:nth-child(even) {
            width: 22%;
            font-weight: 600;
        }

        .spacer-col {
            width: 4% !important;
            border-top: none !important;
            border-bottom: none !important;
            background: transparent !important;
        }

        .wages-table th {
            background-color: #e2e8f0;
            color: #0f172a;
            font-weight: 600;
        }

        .wages-table td {
            font-weight: 600;
        }

        .wages-table td:last-child {
            color: #1e40af;
            background-color: #dbeafe;
            font-size: 9.5px;
        }

        .conditions-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            padding: 3px 5px;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }

        .condition-col {
            width: 48%;
            font-size: 6.5px;
            line-height: 1.3;
            color: #334155;
        }

        .condition-col span {
            display: block;
            font-size: 7px;
            margin-bottom: 1px;
            color: #0f172a;
            border-bottom: 1px solid #94a3b8;
            padding-bottom: 1px;
            font-weight: bold;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            padding-top: 2px;
        }

        .sig-box {
            width: 75px;
            text-align: center;
        }

        .sig-line {
            border-top: 1px solid #0f172a;
            padding-top: 1px;
            font-size: 8px;
            color: #0f172a;
            font-weight: 600;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .control-panel,
            .header-banner {
                display: none;
            }
            .a4-page {
                border: none;
                margin: 0;
                padding: 5mm;
                box-shadow: none;
                page-break-after: always;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 14px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <h1>🏫 Shripur Kindergarten School</h1>
        <p>Wages Slip Management System</p>
    </div>

    <div class="control-panel">
        <div class="control-group">
            <label for="staffSelect">Select Staff:</label>
            <select id="staffSelect">
                <option value="ALL">📋 All Staff Members</option>
            </select>
            
            <div class="btn-group">
                <button class="btn-load" onclick="fetchSlips()">📥 Load Slips</button>
                <button class="btn-print" onclick="window.print()">🖨️ Print All</button>
            </div>
        </div>
        <div id="statusMessage" class="status-message"></div>
    </div>

    <div class="container" id="slipContainer">
        <p style="text-align:center; color:#667eea; margin-top:40px; font-size:14px; font-weight:600;">👆 Click 'Load Slips' button to generate wage slips</p>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwr51gHL1y2SKsV_lMsWmfgOS_gO6eSkTLRWrjWut8E1QHagQcA8tXDmdEsMJA4osBd/exec";
        
        let allSlipsData = [];

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            setTimeout(() => {
                statusEl.className = 'status-message';
            }, 5000);
        }

        function formatCurrency(value) {
            return parseFloat(value || 0).toFixed(2);
        }

        // ============================================
        // CALCULATION ENGINE
        // ============================================
        function calculateWages(slip) {
            const basic = parseFloat(slip.basic) || 0;
            const redFd = parseFloat(slip.redFd) || 0;
            const greenFd = parseFloat(slip.greenFd) || 0;
            const workingDays = parseFloat(slip.workingDay) || 26;
            const manualDeduction = parseFloat(slip.deduction) || 0;

            // RED F.D. DEDUCTION LOGIC
            // IF FD = 1, Basic × FD / 30
            // IF FD > 1, Basic × FD / Working Days
            let redDeduction = 0;
            if (redFd > 0) {
                if (redFd === 1) {
                    redDeduction = (basic * 1) / 30;
                } else if (redFd > 1) {
                    redDeduction = (basic * redFd) / workingDays;
                }
                // Override with manual deduction if provided
                if (manualDeduction > 0) {
                    redDeduction = manualDeduction;
                }
            } else if (manualDeduction > 0) {
                redDeduction = manualDeduction;
            }

            // GREEN F.D. DEDUCTION LOGIC
            // IF FD ≤ 2, Basic × FD / 30
            // IF FD > 2, Basic × FD / Working Days
            let greenDeduction = 0;
            if (greenFd > 0) {
                if (greenFd <= 2) {
                    greenDeduction = (basic * greenFd) / 30;
                } else if (greenFd > 2) {
                    greenDeduction = (basic * greenFd) / workingDays;
                }
            }

            const netWages = basic - redDeduction - greenDeduction;

            return {
                basic: formatCurrency(basic),
                redDeduction: formatCurrency(redDeduction),
                greenDeduction: formatCurrency(greenDeduction),
                netWages: formatCurrency(Math.max(0, netWages))
            };
        }

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadStaffList() {
            try {
                showStatus('Loading staff data...', 'info');
                const response = await fetch(GAS_WEB_APP_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data && Array.isArray(data) && data.length > 0) {
                    allSlipsData = data;
                    
                    const staffSelect = document.getElementById('staffSelect');
                    staffSelect.innerHTML = '<option value="ALL">📋 All Staff Members</option>';

                    data.forEach(slip => {
                        if (slip.name) {
                            const option = document.createElement('option');
                            option.value = slip.name;
                            option.textContent = slip.name;
                            staffSelect.appendChild(option);
                        }
                    });

                    showStatus(`✅ Loaded ${data.length} staff member(s)`, 'success');
                    renderSlips(allSlipsData);
                } else {
                    showStatus('❌ No data found in Google Sheet', 'error');
                    document.getElementById('slipContainer').innerHTML = '<p style="text-align:center; color:red; font-weight:600;">No data available. Check your Google Sheet connection.</p>';
                }
            } catch (error) {
                console.error('Error loading staff list:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
                document.getElementById('slipContainer').innerHTML = `<p style="text-align:center; color:red; font-weight:600;">⚠️ Failed to load data<br>${error.message}</p>`;
            }
        }

        // ============================================
        // SLIP FILTERING
        // ============================================
        function fetchSlips() {
            const selectedName = document.getElementById('staffSelect').value;
            
            if (!allSlipsData || allSlipsData.length === 0) {
                showStatus('❌ No data loaded. Please refresh.', 'error');
                return;
            }

            let slipsToRender;
            if (selectedName === 'ALL') {
                slipsToRender = allSlipsData;
                showStatus(`📄 Generating ${slipsToRender.length} wage slips...`, 'info');
            } else {
                slipsToRender = allSlipsData.filter(slip => slip.name === selectedName);
                showStatus(`📄 Generating ${slipsToRender.length} wage slip(s) for ${selectedName}...`, 'info');
            }

            renderSlips(slipsToRender);
        }

        // ============================================
        // SLIP RENDERING
        // ============================================
        function renderSlips(data) {
            const container = document.getElementById('slipContainer');

            if (!data || data.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:red; font-weight:600;'>❌ No wage slips to display</p>";
                return;
            }

            let pagesHtml = '';
            
            // Process data in chunks of 6 slips per A4 page
            for (let i = 0; i < data.length; i += 6) {
                const pageSlips = data.slice(i, i + 6);
                pagesHtml += '<div class="a4-page">';

                pageSlips.forEach(slip => {
                    const wages = calculateWages(slip);
                    
                    // Safe data extraction with defaults
                    const staffName = slip.name || 'N/A';
                    const staffPost = slip.post || 'N/A';
                    const staffId = slip.id || 'N/A';
                    const staffAddress = slip.address || 'N/A';
                    const staffPhone = slip.phone || 'N/A';
                    const month = slip.month || 'January';
                    
                    const totalDays = slip.totalDay || 30;
                    const workingDays = slip.workingDay || 26;
                    const sundays = slip.sunDay || 0;
                    const redFd = slip.redFd || 0;
                    const holidays = slip.holiDay || 0;
                    const greenFd = slip.greenFd || 0;

                    pagesHtml += `
                        <div class="salary-slip">
                            <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                                <!-- HEADER -->
                                <div class="school-header">
                                    <div class="school-top">
                                        <h3>Shripur Kindergarten School</h3>
                                    </div>
                                    <div class="school-address">At: Shripur, PO: Jharbari, PS: Goalpokher, Distt: Uttardinajpur, WB, Pin: 733210</div>
                                    <div class="month-title">Wages Slip for ${month} 2026</div>
                                </div>

                                <!-- STAFF INFO -->
                                <div class="staff-info-box">
                                    <div class="staff-left">
                                        <div>Name: <strong>${staffName}</strong></div>
                                        <div>Post: <strong>${staffPost}</strong></div>
                                        <div>ID: <strong>${staffId}</strong></div>
                                    </div>
                                    <div class="staff-right">
                                        <div>Address: ${staffAddress}</div>
                                        <div>Phone: ${staffPhone}</div>
                                    </div>
                                </div>

                                <!-- PERFORMANCE DETAILS -->
                                <div class="section-title">Performance Details</div>
                                <table class="performance-table">
                                    <tr>
                                        <td>Total Days</td>
                                        <td>${totalDays}</td>
                                        <td class="spacer-col"></td>
                                        <td>Working Days</td>
                                        <td>${workingDays}</td>
                                    </tr>
                                    <tr>
                                        <td>Sundays</td>
                                        <td>${sundays}</td>
                                        <td class="spacer-col"></td>
                                        <td>Red F.D.</td>
                                        <td>${redFd}</td>
                                    </tr>
                                    <tr>
                                        <td>Holidays</td>
                                        <td>${holidays}</td>
                                        <td class="spacer-col"></td>
                                        <td>Green F.D.</td>
                                        <td>${greenFd}</td>
                                    </tr>
                                </table>

                                <!-- WAGES CALCULATION -->
                                <div class="section-title">Wages Details</div>
                                <table class="wages-table">
                                    <tr>
                                        <th>Basic</th>
                                        <th>Red Dtn.</th>
                                        <th>Green Dtn.</th>
                                        <th>Net Pay</th>
                                    </tr>
                                    <tr>
                                        <td>${wages.basic}</td>
                                        <td>${wages.redDeduction}</td>
                                        <td>${wages.greenDeduction}</td>
                                        <td>${wages.netWages}</td>
                                    </tr>
                                </table>

                                <!-- DEDUCTION RULES -->
                                <div class="conditions-box">
                                    <div class="condition-col">
                                        <span>Red Deduction</span>
                                        If FD=1: Basic÷30<br>
                                        If FD>1: Basic÷WorkDays
                                    </div>
                                    <div class="condition-col">
                                        <span>Green Deduction</span>
                                        If FD≤2: Basic÷30<br>
                                        If FD>2: Basic÷WorkDays
                                    </div>
                                </div>
                            </div>

                            <!-- SIGNATURE BOXES -->
                            <div class="signatures">
                                <div class="sig-box">
                                    <div class="sig-line">Staff Signature</div>
                                </div>
                                <div class="sig-box">
                                    <div class="sig-line">Principal</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                pagesHtml += '</div>';
            }

            container.innerHTML = pagesHtml;
            showStatus(`✅ Generated ${data.length} wage slip(s) successfully!`, 'success');
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener('load', () => {
            loadStaffList();
        });

        // Fallback in case DOMContentLoaded doesn't fire
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadStaffList);
        }
    </script>
</body>
</html>
