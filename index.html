<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shripur Kindergarten School - Wages Slip Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #cbd5e1;
            color: #0f172a;
            padding: 10px;
        }

        .no-print {
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .no-print h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group select {
            padding: 8px 12px;
            font-size: 13px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .filter-group button {
            padding: 8px 16px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-load {
            background-color: #3b82f6;
            color: white;
        }

        .btn-load:hover {
            background-color: #2563eb;
        }

        .btn-print {
            background-color: #10b981;
            color: white;
        }

        .btn-print:hover {
            background-color: #059669;
        }

        .container {
            max-width: 210mm;
            margin: 0 auto;
        }

        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            margin: 0 auto 15mm auto;
            padding: 8mm;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 5mm;
            page-break-after: always;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .salary-slip {
            border: 1.5px solid #1f2937;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 8.5px;
            line-height: 1.3;
        }

        .school-header {
            text-align: center;
            border-bottom: 2px solid #1f2937;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }

        .school-header img {
            height: 24px;
            width: auto;
            margin-bottom: 4px;
        }

        .school-header h3 {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .school-address {
            font-size: 7px;
            color: #4b5563;
            margin-bottom: 3px;
            line-height: 1.2;
        }

        .month-title {
            font-size: 8px;
            font-weight: 600;
            color: #334155;
        }

        .staff-box {
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 5px;
            margin-bottom: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 7.5px;
        }

        .staff-col {
            line-height: 1.3;
        }

        .staff-label {
            font-weight: 700;
            color: #1f2937;
        }

        .section-title {
            font-size: 8px;
            font-weight: 700;
            color: #0f172a;
            margin: 4px 0 3px 0;
            border-bottom: 1px solid #3b82f6;
            padding-bottom: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 7.5px;
            margin-bottom: 4px;
        }

        th, td {
            border: 1px solid #64748b;
            padding: 2px 3px;
            text-align: center;
        }

        th {
            background-color: #e5e7eb;
            font-weight: 700;
            color: #1f2937;
        }

        .perf-label {
            text-align: left;
            background-color: #f9fafb;
            font-weight: 600;
            width: 40%;
        }

        .perf-value {
            width: 20%;
        }

        .spacer {
            border: none;
            background: transparent;
        }

        .net-cell {
            background-color: #dbeafe;
            font-weight: 700;
            color: #1e40af;
        }

        .conditions {
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 3px;
            padding: 4px;
            margin-bottom: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            font-size: 6.5px;
            line-height: 1.2;
        }

        .condition-item span {
            display: block;
            font-weight: 700;
            color: #1f2937;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 2px;
            margin-bottom: 2px;
            font-size: 7px;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid #d1d5db;
        }

        .sig {
            width: 45%;
            text-align: center;
            font-size: 7px;
        }

        .sig-line {
            border-top: 1px solid #1f2937;
            padding-top: 2px;
            margin-top: 8px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #6b7280;
            padding: 40px;
            font-size: 14px;
        }

        .error {
            text-align: center;
            color: #dc2626;
            padding: 40px;
            font-size: 14px;
            background: #fee2e2;
            border-radius: 8px;
            margin: 20px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .a4-page {
                margin: 0;
                padding: 8mm;
                box-shadow: none;
                page-break-after: always;
                height: 297mm;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Shripur Kindergarten School</h1>
        <p style="color: #6b7280; font-size: 16px; margin-bottom: 20px;">Wages Slip Portal</p>
        
        <div class="filter-group">
            <select id="monthYearSelect">
                <option value="ALL">All Months & Years</option>
            </select>

            <select id="staffSelect">
                <option value="ALL">All Staff</option>
            </select>

            <button class="btn-load" onclick="applyFilters()">Load Slips</button>
            <button class="btn-print" onclick="window.print()">Print All</button>
        </div>
    </div>

    <div class="container" id="slipContainer">
        <div class="loading">Loading wages data...</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby9ztHIsUquB8bcsBEtajptsjOg85Eaxqoi1p9RzxLe8bJhKG-WjDwQlG503jxcEgkI/exec";
        let allData = [];

        async function fetchData() {
            try {
                const response = await fetch(GAS_URL, { redirect: 'follow' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const rawData = await response.json();
                processData(rawData);
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('slipContainer').innerHTML = `<div class="error">Failed to load data: ${error.message}</div>`;
            }
        }

        function processData(rawData) {
            console.log('Received data:', rawData);
            
            if (!Array.isArray(rawData) || rawData.length === 0) {
                document.getElementById('slipContainer').innerHTML = '<div class="error">No data received</div>';
                return;
            }

            let processed = [];

            // Check if data is array of arrays or array of objects
            if (Array.isArray(rawData[0])) {
                // Array of arrays - first row is header
                const headers = rawData[0].map(h => String(h || '').trim());
                
                for (let i = 1; i < rawData.length; i++) {
                    const row = rawData[i];
                    if (!row || row.length === 0) continue;
                    
                    const obj = {};
                    headers.forEach((header, idx) => {
                        obj[header] = String(row[idx] || '').trim();
                    });
                    processed.push(obj);
                }
            } else {
                // Array of objects
                processed = rawData.map(item => {
                    const obj = {};
                    Object.keys(item).forEach(key => {
                        obj[key.trim()] = String(item[key] || '').trim();
                    });
                    return obj;
                });
            }

            console.log('Processed rows:', processed.length);
            console.log('Sample row:', processed[0]);

            // Filter for ACT status
            allData = processed.filter(row => {
                const stat = String(row.STAT || '').trim().toUpperCase();
                return stat === 'ACT';
            });

            console.log('ACT records found:', allData.length);

            if (allData.length === 0) {
                document.getElementById('slipContainer').innerHTML = '<div class="error">No active records found</div>';
                return;
            }

            populateFilters();
            renderSlips(allData);
        }

        function populateFilters() {
            const monthYearSet = new Set();
            const staffSet = new Set();

            allData.forEach(row => {
                const month = String(row.MONTH || '').trim();
                const year = String(row.YEAR || '').trim();
                const name = String(row.NAME_OF_STAFF || '').trim();
                
                if (month && year) {
                    monthYearSet.add(`${month} ${year}`);
                }
                if (name) {
                    staffSet.add(name);
                }
            });

            const monthYearSelect = document.getElementById('monthYearSelect');
            Array.from(monthYearSet).sort().forEach(my => {
                const option = document.createElement('option');
                option.value = my;
                option.textContent = my;
                monthYearSelect.appendChild(option);
            });

            const staffSelect = document.getElementById('staffSelect');
            Array.from(staffSet).sort().forEach(staff => {
                const option = document.createElement('option');
                option.value = staff;
                option.textContent = staff;
                staffSelect.appendChild(option);
            });
        }

        function applyFilters() {
            const selectedMonthYear = document.getElementById('monthYearSelect').value;
            const selectedStaff = document.getElementById('staffSelect').value;

            let filtered = allData;

            if (selectedMonthYear !== 'ALL') {
                const [month, year] = selectedMonthYear.split(' ');
                filtered = filtered.filter(row => 
                    String(row.MONTH || '').trim() === month && 
                    String(row.YEAR || '').trim() === year
                );
            }

            if (selectedStaff !== 'ALL') {
                filtered = filtered.filter(row => 
                    String(row.NAME_OF_STAFF || '').trim() === selectedStaff
                );
            }

            renderSlips(filtered);
        }

        function renderSlips(data) {
            const container = document.getElementById('slipContainer');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="error" style="margin-top: 40px;">No matching records</div>';
                return;
            }

            let html = '';
            for (let pageIdx = 0; pageIdx < data.length; pageIdx += 6) {
                const pageSlips = data.slice(pageIdx, pageIdx + 6);
                html += '<div class="a4-page">';

                pageSlips.forEach(row => {
                    html += generateSlip(row);
                });

                html += '</div>';
            }

            container.innerHTML = html;
        }

        function generateSlip(row) {
            const basic = parseFloat(row.BASIC) || 0;
            const redFd = parseFloat(row.RED_FD) || 0;
            const greenFd = parseFloat(row.GREEN_FD) || 0;
            const workingDay = parseFloat(row.WORKING_DAY) || 26;
            const advanced = parseFloat(row.ADVANCED) || 0;
            const fees = parseFloat(row.FEES) || 0;

            // Red Deduction calculation
            let redDtn = 0;
            if (redFd === 1) {
                redDtn = (basic * 1) / 30;
            } else if (redFd > 1) {
                redDtn = (basic * redFd) / workingDay;
            }

            // Green Deduction calculation
            let greenDtn = 0;
            if (greenFd > 0 && greenFd <= 2) {
                greenDtn = (basic * greenFd) / 30;
            } else if (greenFd > 2) {
                greenDtn = (basic * greenFd) / workingDay;
            }

            // Final Net Wages
            const netWages = (basic - redDtn - greenDtn - advanced - fees).toFixed(2);

            const month = String(row.MONTH || '').trim();
            const year = String(row.YEAR || '').trim();
            const name = String(row.NAME_OF_STAFF || '').trim();
            const phone = String(row.PHONE_NO || '').trim();
            const address = String(row.ADDRESS || '').trim();
            const totalDay = String(row.TOTAL_DAY || '').trim();
            const sunDay = String(row.SUN_DAY || '').trim();
            const holiDay = String(row.HOLI_DAY || '').trim();

            return `
                <div class="salary-slip">
                    <div>
                        <div class="school-header">
                            <img src="Images/logo.png" alt="Logo" onerror="this.style.display='none'">
                            <h3>SHRIPUR KINDERGARTEN SCHOOL</h3>
                            <div class="school-address">At: Shripur, PO: Jharbari, PS: Goalpokher, Distt: Uttardinajpur, WB, Pin: 733210</div>
                            <div class="month-title">Wages Slip # ${month} # ${year}</div>
                        </div>

                        <div class="staff-box">
                            <div class="staff-col">
                                <div><span class="staff-label">Name:</span> ${name}</div>
                                <div><span class="staff-label">Advanced:</span> ${advanced.toFixed(2)}</div>
                                <div><span class="staff-label">Fees:</span> ${fees.toFixed(2)}</div>
                            </div>
                            <div class="staff-col">
                                <div><span class="staff-label">Address:</span> ${address}</div>
                                <div><span class="staff-label">Phone:</span> ${phone}</div>
                            </div>
                        </div>

                        <div class="section-title">Performance Details</div>
                        <table>
                            <tr>
                                <td class="perf-label">Total Days</td>
                                <td class="perf-value">${totalDay}</td>
                                <td class="spacer"></td>
                                <td class="perf-label">Working Days</td>
                                <td class="perf-value">${workingDay.toFixed(0)}</td>
                            </tr>
                            <tr>
                                <td class="perf-label">Sundays</td>
                                <td class="perf-value">${sunDay}</td>
                                <td class="spacer"></td>
                                <td class="perf-label">Red F.D.</td>
                                <td class="perf-value">${redFd.toFixed(0)}</td>
                            </tr>
                            <tr>
                                <td class="perf-label">Holidays</td>
                                <td class="perf-value">${holiDay}</td>
                                <td class="spacer"></td>
                                <td class="perf-label">Green F.D.</td>
                                <td class="perf-value">${greenFd.toFixed(0)}</td>
                            </tr>
                        </table>

                        <div class="section-title">Wages Details</div>
                        <table>
                            <tr>
                                <th>Basic</th>
                                <th>Red Dtn</th>
                                <th>Green Dtn</th>
                                <th>Net</th>
                            </tr>
                            <tr>
                                <td>${basic.toFixed(2)}</td>
                                <td>${redDtn.toFixed(2)}</td>
                                <td>${greenDtn.toFixed(2)}</td>
                                <td class="net-cell">${netWages}</td>
                            </tr>
                        </table>

                        <div class="conditions">
                            <div class="condition-item">
                                <span>Red Deduction</span>
                                If FD=1: Basic÷30<br>If FD>1: Basic×FD÷WorkDays
                            </div>
                            <div class="condition-item">
                                <span>Green Deduction</span>
                                If FD≤2: Basic×FD÷30<br>If FD>2: Basic×FD÷WorkDays
                            </div>
                        </div>
                    </div>

                    <div class="signatures">
                        <div class="sig">
                            <div class="sig-line">Staff</div>
                        </div>
                        <div class="sig">
                            <div class="sig-line">Principal</div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = fetchData;
    </script>

</body>
</html>
