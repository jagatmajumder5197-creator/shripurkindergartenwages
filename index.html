<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shripur Kindergarten School - Salary Slip</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #000;
            padding: 20px;
        }

        .no-print {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .no-print h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 20px;
            text-align: center;
        }

        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .form-group select, .form-group input, .form-group button {
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .form-group button:hover {
            background-color: #218838;
        }

        .print-btn {
            background-color: #007bff !important;
            display: block;
            margin: 10px auto;
            padding: 10px 30px;
            font-size: 16px;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* A4 Page Layout - 1 slip per page */
        .container {
            max-width: 210mm;
            margin: 0 auto;
        }

        .salary-slip {
            width: 190mm;
            height: 270mm; /* A4 full page height adjustment */
            margin: 0 auto 10mm auto;
            background: #fff;
            border: 2px solid #000;
            padding: 20px 25px;
            page-break-after: always;
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .school-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .school-header img {
            height: 50px;
            width: auto;
        }

        .school-header h3 {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .school-header .month-title {
            font-size: 14px;
            font-weight: bold;
            margin-top: 3px;
            color: #444;
        }

        .staff-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
        }

        .staff-info div {
            line-height: 1.5;
        }

        .section-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            background: #eee;
            border: 1px solid #000;
            padding: 4px;
            margin-bottom: 6px;
        }

        .performance-table, .wages-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .performance-table th, .performance-table td,
        .wages-table th, .wages-table td {
            border: 1px solid #000;
            padding: 6px 8px;
            text-align: center;
        }

        .performance-table td {
            text-align: left;
        }
        .performance-table td:nth-child(even), .performance-table td:nth-child(4) {
            text-align: center;
        }

        .conditions {
            font-size: 11px;
            border: 1px solid #000;
            padding: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .condition-box {
            width: 48%;
        }

        .condition-box b {
            display: block;
            text-align: center;
            border-bottom: 1px solid #000;
            margin-bottom: 4px;
            color: #d9534f;
        }
        .condition-box:nth-child(2) b {
            color: #28a745;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 12px;
            padding-top: 30px;
        }

        .sig-line {
            width: 180px;
            border-top: 1px solid #000;
            text-align: center;
            padding-top: 4px;
            font-weight: bold;
        }

        /* Print Media Styles */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .no-print {
                display: none;
            }
            .salary-slip {
                border: 1px solid #000;
                margin: 0;
                page-break-after: always;
            }
            @page {
                size: A4;
                margin: 5mm;
            }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h2>Shripur Kindergarten School - Salary Portal</h2>
        <div class="form-group">
            <select id="monthSelect">
                <option value="AUGUST">August 2026</option>
                <option value="JULY">July 2026</option>
                <option value="SEPTEMBER">September 2026</option>
            </select>
            <input type="text" id="uidInput" placeholder="UID (Optional e.g. STF01)">
            <button onclick="fetchSlips()">Generate Slips</button>
        </div>
        <button class="print-btn" onclick="window.print()">Print Slips (1 per Page)</button>
    </div>

    <div class="container" id="slipContainer">
        <p style="text-align:center; color:#666;">মাস সিলেক্ট করে 'Generate Slips' এ ক্লিক করুন।</p>
    </div>

    <script>
        // আপনার GAS Web App এর URL এখানে বসাবেন
        const GAS_WEB_APP_URL = "YOUR_GAS_WEB_APP_URL_HERE";

        async function fetchSlips() {
            const month = document.getElementById('monthSelect').value;
            const uid = document.getElementById('uidInput').value.trim();
            const container = document.getElementById('slipContainer');

            container.innerHTML = "<p style='text-align:center;'>লোড হচ্ছে...</p>";

            try {
                let url = `${GAS_WEB_APP_URL}?month=${month}`;
                if (uid) url += `&uid=${uid}`;

                const response = await fetch(url);
                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:red;'>কোনো ডেটা পাওয়া যায়নি!</p>";
                    return;
                }

                let html = '';
                
                data.forEach(slip => {
                    html += `
                        <div class="salary-slip">
                            <div>
                                <div class="school-header">
                                    <img src="Images/logo.png" alt="School Logo" onerror="this.style.display='none'">
                                    <div>
                                        <h3>SHRIPUR KINDERGARTEN SCHOOL</h3>
                                        <div class="month-title">SALARY SLIP - ${slip.month} 2026</div>
                                    </div>
                                </div>

                                <div class="staff-info">
                                    <div><b>NAME:</b> ${slip.name}</div>
                                    <div><b>PH NO:</b> ${slip.phone}</div>
                                </div>
                                <div class="staff-info" style="margin-top: -4px;">
                                    <div><b>UID:</b> ${slip.uid}</div>
                                    <div><b>ADDRESS:</b> ${slip.address}</div>
                                </div>

                                <div class="section-title">Performance Details</div>
                                <table class="performance-table">
                                    <tr>
                                        <td>Total Days :</td>
                                        <td><b>${slip.totalDay}</b></td>
                                        <td>Working Days :</td>
                                        <td><b>${slip.workingDay}</b></td>
                                    </tr>
                                    <tr>
                                        <td>Sundays :</td>
                                        <td><b>${slip.sunDay}</b></td>
                                        <td>Red F.D. :</td>
                                        <td><b style="color:red;">${slip.redFd}</b></td>
                                    </tr>
                                    <tr>
                                        <td>Holi Days :</td>
                                        <td><b>${slip.holiDay}</b></td>
                                        <td>Green F.D. :</td>
                                        <td><b style="color:green;">${slip.greenFd}</b></td>
                                    </tr>
                                </table>

                                <div class="section-title">Wages Details</div>
                                <table class="wages-table">
                                    <tr>
                                        <th>Basic Pay</th>
                                        <th>RED Deduction</th>
                                        <th>GREEN Deduction</th>
                                        <th>NET Wages</th>
                                    </tr>
                                    <tr>
                                        <td>${slip.basic}</td>
                                        <td style="color:red;">${slip.deduction > 0 ? slip.deduction : '0.00'}</td>
                                        <td style="color:green;">0.00</td>
                                        <td><b>${slip.netWages}</b></td>
                                    </tr>
                                </table>

                                <div class="conditions">
                                    <div class="condition-box">
                                        <b>Red Deduction</b>
                                        If FD=1, Basic×FD/30<br>
                                        If FD>1, Basic×FD/Working Days
                                    </div>
                                    <div class="condition-box">
                                        <b>Green Deduction</b>
                                        If FD<=2, Basic×FD/30<br>
                                        If FD>2, Basic×FD/Working Days
                                    </div>
                                </div>
                            </div>

                            <div class="signatures">
                                <div class="sig-line">Sign of Staff</div>
                                <div class="sig-line">Sign of Principal</div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                console.error(error);
                container.innerHTML = "<p style='text-align:center; color:red;'>ডেটা ফেচ করতে সমস্যা হয়েছে!</p>";
            }
        }
    </script>
</body>
</html>
